    <!-- ===== MODAL ===== -->
    <div id="modal" class="overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal">
            <div class="modal-emoji" id="modal-emoji">🏆</div>
            <div class="modal-title" id="modal-title">X gagne !</div>
            <div class="modal-text" id="modal-text">Belle partie !</div>
            <div class="modal-btns">
                <button class="modal-btn" onclick="showMenu()" data-fr="Menu" data-en="Menu">Menu</button>
                <button class="modal-btn primary" id="modal-primary" onclick="resetGame(); closeModal();" data-fr="Rejouer" data-en="Play Again">Rejouer</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---- DOM refs ----
            const $ = id => document.getElementById(id);
            const boardEl = document.getElementById('board');
            const cells = boardEl.querySelectorAll('.cell');

            // ---- State ----
            const board = Array(9).fill('');
            let currentPlayer = 'X';
            let gameMode = 'pvp'; // 'pvp' | 'ai-hard'
            let gameActive = false;
            let aiThinking = false;
            let playerSymbol = 'X';
            let aiSymbol = 'O';
            let currentLang = 'fr';

            // Stats
            let statsX = 0;
            let statsO = 0;
            let statsDraw = 0;
            let difficulty = 'hard'; // easy | medium | hard
            const MISTAKE_RATE = { easy: 0.7, medium: 0.3, hard: 0 };
            let history = [];          // moves played this round (for undo)
            let seriesFormat = 1;      // 1 = single game, 3 or 5 = first to win the majority
            let seriesX = 0, seriesO = 0, seriesOver = false;
            let confettiRaf = 0;

            // Audio
            let audioCtx = null;
            let sfxOut = null, noiseBuf = null;

            const winCombos = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];

            // ---- Audio (Web Audio API, everything synthesized live) ----
            function getAudioCtx() {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                return audioCtx;
            }

            // Shared output: gentle compressor so loud jingles never clip
            function getSfxOut(ctx) {
                if (!sfxOut) {
                    const comp = ctx.createDynamicsCompressor();
                    comp.threshold.value = -14;
                    comp.ratio.value = 5;
                    const g = ctx.createGain();
                    g.gain.value = 0.9;
                    g.connect(comp);
                    comp.connect(ctx.destination);
                    sfxOut = g;
                }
                return sfxOut;
            }

            function getNoise(ctx) {
                if (!noiseBuf) {
                    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
                    const d = noiseBuf.getChannelData(0);
                    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                }
                return noiseBuf;
            }

            const hz = m => 440 * Math.pow(2, (m - 69) / 12); // MIDI note -> Hz

            // One synthesized note. o: f, f2 (glide target), glide, t (delay), d (duration),
            // type, v (volume), a (attack), hold, lp (lowpass), detune, vib, vibDepth
            function blip(ctx, o) {
                const out = getSfxOut(ctx);
                const t = ctx.currentTime + (o.t || 0);
                const d = o.d || 0.1;
                const a = o.a === undefined ? 0.005 : o.a;
                const v = o.v || 0.15;
                const hold = Math.min(Math.max(a, o.hold || 0), d - 0.01);
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = o.type || 'sine';
                osc.frequency.setValueAtTime(o.f, t);
                if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || d));
                if (o.detune) osc.detune.value = o.detune;
                let node = osc;
                if (o.lp) {
                    const f = ctx.createBiquadFilter();
                    f.type = 'lowpass';
                    f.frequency.value = o.lp;
                    osc.connect(f);
                    node = f;
                }
                node.connect(g);
                g.connect(out);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(v, t + a);
                g.gain.setValueAtTime(v, t + hold);
                g.gain.exponentialRampToValueAtTime(0.0001, t + d);
                if (o.vib) {
                    const lfo = ctx.createOscillator();
                    const lg = ctx.createGain();
                    lfo.frequency.value = o.vib;
                    lg.gain.value = o.vibDepth || 12;
                    lfo.connect(lg);
                    lg.connect(osc.detune);
                    lfo.start(t);
                    lfo.stop(t + d + 0.05);
                }
                osc.start(t);
                osc.stop(t + d + 0.05);
            }

            // Filtered noise burst (explosion / whoosh)
            function burst(ctx, t0, d, v, f1, f2) {
                const out = getSfxOut(ctx);
                const t = ctx.currentTime + t0;
                const src = ctx.createBufferSource();
                src.buffer = getNoise(ctx);
                const f = ctx.createBiquadFilter();
                f.type = 'lowpass';
                f.frequency.setValueAtTime(f1, t);
                f.frequency.exponentialRampToValueAtTime(f2, t + d);
                const g = ctx.createGain();
                g.gain.setValueAtTime(v, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + d);
                src.connect(f);
                f.connect(g);
                g.connect(out);
                src.start(t);
                src.stop(t + d + 0.05);
            }

            function playSound(type) {
                try {
                    const ctx = getAudioCtx();
                    switch (type) {
                        case 'click': // buttons
                            blip(ctx, { f: 1000, f2: 640, d: 0.05, type: 'triangle', v: 0.1 });
                            break;
                        case 'move':
                        case 'moveX': // bright "tick" for X
                            blip(ctx, { f: 620, f2: 900, d: 0.1, type: 'triangle', v: 0.16 });
                            blip(ctx, { f: 1240, d: 0.06, type: 'sine', v: 0.05 });
                            break;
                        case 'moveO': // rounder, lower "pop" for O
                            blip(ctx, { f: 330, f2: 450, d: 0.12, type: 'sine', v: 0.22 });
                            blip(ctx, { f: 660, d: 0.07, type: 'sine', v: 0.06 });
                            break;
                        case 'win': // short explosive victory fanfare
                            burst(ctx, 0, 0.55, 0.35, 3500, 80);
                            blip(ctx, { f: hz(48), f2: hz(36), d: 0.45, type: 'sine', v: 0.35 });
                            [72, 76, 79, 84].forEach((m, i) => {
                                blip(ctx, { f: hz(m), t: 0.08 + i * 0.08, d: 0.16, type: 'square', v: 0.09, lp: 3500 });
                                blip(ctx, { f: hz(m), t: 0.08 + i * 0.08, d: 0.16, type: 'sawtooth', v: 0.05, detune: 8 });
                            });
                            [60, 64, 67, 72, 76].forEach(m => {
                                blip(ctx, { f: hz(m), t: 0.42, d: 1.1, type: 'sawtooth', v: 0.06, lp: 2800, detune: -6, hold: 0.35 });
                                blip(ctx, { f: hz(m), t: 0.42, d: 1.1, type: 'square', v: 0.035, lp: 2200, detune: 6, hold: 0.35 });
                            });
                            [91, 96, 100, 103, 108].forEach((m, i) => {
                                blip(ctx, { f: hz(m), t: 0.5 + i * 0.07, d: 0.28, type: 'sine', v: 0.06 });
                            });
                            break;
                        case 'lose': // sad descending "wah wah wah waaah"
                            [[67, 0], [66, 0.34], [65, 0.68]].forEach(([m, t]) => {
                                blip(ctx, { f: hz(m), f2: hz(m) * 0.985, t: t, d: 0.32, type: 'sawtooth', v: 0.11, lp: 900, a: 0.03 });
                            });
                            blip(ctx, { f: hz(64), f2: hz(55), glide: 1.1, t: 1.05, d: 1.3, type: 'sawtooth', v: 0.13, lp: 700, a: 0.04, vib: 5.5, vibDepth: 25, hold: 0.5 });
                            blip(ctx, { f: hz(52), f2: hz(43), glide: 1.1, t: 1.05, d: 1.3, type: 'sine', v: 0.12, hold: 0.5 });
                            break;
                        case 'draw':
                            blip(ctx, { f: hz(64), d: 0.18, type: 'triangle', v: 0.13 });
                            blip(ctx, { f: hz(60), t: 0.16, d: 0.3, type: 'triangle', v: 0.13 });
                            break;
                        case 'start':
                            [64, 68, 71, 76].forEach((m, i) => {
                                blip(ctx, { f: hz(m), t: i * 0.06, d: 0.22, type: 'triangle', v: 0.12 });
                            });
                            break;
                    }
                } catch (_) { /* ignore */ }
            }

            // ---- Saved data (scores + AI level) ----
            function saveData() {
                try {
                    localStorage.setItem('xo_data', JSON.stringify({ x: statsX, o: statsO, d: statsDraw, level: difficulty, series: seriesFormat }));
                } catch (_) { /* storage unavailable */ }
            }

            function loadData() {
                try {
                    const d = JSON.parse(localStorage.getItem('xo_data') || 'null');
                    if (d) {
                        statsX = +d.x || 0;
                        statsO = +d.o || 0;
                        statsDraw = +d.d || 0;
                        if (MISTAKE_RATE[d.level] !== undefined) difficulty = d.level;
                        if ([1, 3, 5].includes(+d.series)) seriesFormat = +d.series;
                    }
                } catch (_) { /* ignore */ }
            }

            const LEVELS = {
                easy: { fr: 'Facile', en: 'Easy', cls: 'badge-easy',
                    dFr: 'Un adversaire débutant qui se trompe souvent, pour jouer détendu', dEn: 'A beginner opponent that slips often' },
                medium: { fr: 'Moyen', en: 'Medium', cls: 'badge-medium',
                    dFr: 'Un bon adversaire qui se trompe parfois', dEn: 'A solid opponent that sometimes slips' },
                hard: { fr: 'Difficile', en: 'Hard', cls: 'badge-hard',
                    dFr: 'Un adversaire qui ne se trompe jamais. Peux-tu faire match nul ?', dEn: 'An opponent that never slips. Can you draw?' }
            };

            function applyDifficulty() {
                const L = LEVELS[difficulty];
                const badge = $('ai-badge');
                badge.className = 'badge ' + L.cls;
                badge.setAttribute('data-fr', L.fr);
                badge.setAttribute('data-en', L.en);
                const desc = $('ai-desc');
                desc.setAttribute('data-fr', L.dFr);
                desc.setAttribute('data-en', L.dEn);
                document.querySelectorAll('.level-btn[data-level]').forEach(b => {
                    b.classList.toggle('active', b.dataset.level === difficulty);
                });
                updateLanguage();
            }

            function setDifficulty(level) {
                if (MISTAKE_RATE[level] === undefined) return;
                difficulty = level;
                applyDifficulty();
                saveData();
                playSound('click');
            }

            function resetStats() {
                statsX = statsO = statsDraw = 0;
                updateStatsUI();
                saveData();
                playSound('click');
            }

            function applyFormat() {
                document.querySelectorAll('.fmt-btn').forEach(b => {
                    b.classList.toggle('active', +b.dataset.format === seriesFormat);
                });
            }

            function setFormat(n) {
                if (![1, 3, 5].includes(n)) return;
                seriesFormat = n;
                applyFormat();
                saveData();
                playSound('click');
            }

            function updateSeriesUI() {
                const el = $('series-info');
                if (seriesFormat === 1) {
                    el.style.display = 'none';
                    el.textContent = '';
                    return;
                }
                el.style.display = 'block';
                const label = currentLang === 'fr' ? 'Match en ' + seriesFormat : 'Best of ' + seriesFormat;
                el.innerHTML = label + ' · <span class="sc-x">X ' + seriesX + '</span> – <span class="sc-o">' + seriesO + ' O</span>';
            }

            // ---- Stats UI update ----
            function updateStatsUI() {
                // Menu stats
                $('menu-stat-x').textContent = statsX;
                $('menu-stat-o').textContent = statsO;
                $('menu-stat-draw').textContent = statsDraw;
                // Game stats
                $('game-stat-x').textContent = statsX;
                $('game-stat-o').textContent = statsO;
                $('game-stat-draw').textContent = statsDraw;
            }

            // ---- Language ----
            function updateLanguage() {
                document.querySelectorAll('[data-fr][data-en]').forEach(el => {
                    el.textContent = el.getAttribute('data-' + currentLang);
                });
                document.documentElement.setAttribute('lang', currentLang);
                document.querySelectorAll('.start-lang b, .lang-toggle b').forEach(b => {
                    b.classList.toggle('active', b.dataset.l === currentLang);
                });
                const mb = $('music-btn');
                if (mb) {
                    const label = currentLang === 'fr' ? 'Musique' : 'Music';
                    mb.setAttribute('aria-label', label);
                    mb.setAttribute('title', label);
                }
                if (gameActive) {
                    updateTurn();
                    updatePlayerInfo();
                }
            }

            function toggleLanguage() {
                currentLang = currentLang === 'fr' ? 'en' : 'fr';
                try { localStorage.setItem('xo_lang', currentLang); } catch (_) {}
                updateLanguage();
                playSound('click');
            }

            // ---- Navigation ----
            function goToMenu() {
                playSound('start');
                $('start-screen').classList.add('hidden');
                $('menu').classList.add('visible');
                $('menu').style.display = 'flex';
                $('game').classList.remove('visible');
                $('game').style.display = 'none';
            }

            function goToStart() {
                playSound('click');
                $('menu').classList.remove('visible');
                $('menu').style.display = 'none';
                $('start-screen').classList.remove('hidden');
            }

            function showMenu() {
                playSound('click');
                closeModal();
                $('menu').classList.add('visible');
                $('menu').style.display = 'flex';
                $('game').classList.remove('visible');
                $('game').style.display = 'none';
                gameActive = false;
                aiThinking = false;
            }

            function startGame(mode) {
                playSound('click');
                gameMode = mode;
                seriesX = seriesO = 0;
                seriesOver = false;
                $('menu').classList.remove('visible');
                $('menu').style.display = 'none';
                $('game').classList.add('visible');
                $('game').style.display = 'flex';
                resetGame();
            }

            // ---- Game logic ----
            function resetGame() {
                if (seriesOver) { seriesX = seriesO = 0; seriesOver = false; }
                history = [];
                board.fill('');
                if (gameMode !== 'pvp') {
                    playerSymbol = Math.random() < 0.5 ? 'X' : 'O';
                    aiSymbol = playerSymbol === 'X' ? 'O' : 'X';
                } else {
                    playerSymbol = 'X';
                    aiSymbol = 'O';
                }
                currentPlayer = Math.random() < 0.5 ? 'X' : 'O';
                gameActive = true;
                aiThinking = false;
                closeModal();
                renderBoard();
                updatePlayerInfo();
                updateTurn();
                $('game-status').textContent = '';
                $('game-status').style.color = '#fff';

                if (gameMode !== 'pvp' && currentPlayer === aiSymbol) {
                    aiThinking = true;
                    const msg = currentLang === 'fr' ? "L'IA commence..." : 'AI starts...';
                    $('turn-text').textContent = msg;
                    setTimeout(() => { aiMove(); }, 80);
                }
            }

            const SVG_X = '<svg viewBox="0 0 100 100" class="mark-x"><line class="m" style="--len:113" x1="14" y1="14" x2="86" y2="86"/><line class="m" style="--len:113" x1="86" y1="14" x2="14" y2="86"/></svg>';
            const SVG_O = '<svg viewBox="0 0 100 100" class="mark-o"><circle class="m" style="--len:276" cx="50" cy="50" r="38"/></svg>';

            function renderBoard() {
                cells.forEach((cell, i) => {
                    const v = board[i];
                    if (cell.dataset.mark !== v) {
                        cell.dataset.mark = v;
                        cell.innerHTML = v ? (v === 'X' ? SVG_X : SVG_O) : '';
                        cell.classList.toggle('new', !!v);
                    }
                    cell.classList.toggle('taken', !!v);
                    cell.classList.remove('win');
                });
                boardEl.classList.remove('won');
                const wl = boardEl.querySelector('.win-line');
                if (wl) wl.remove();
            }

            function updateTurn() {
                boardEl.dataset.turn = (gameMode === 'pvp' || currentPlayer === playerSymbol) ? currentPlayer : '';
                const dot = $('turn-dot');
                const text = $('turn-text');
                if (currentPlayer === 'X') {
                    $('gs-x').classList.add('active'); $('gs-o').classList.remove('active');
                    dot.className = 'dot dot-x';
                    text.textContent = currentLang === 'fr' ? 'Tour de X' : 'X Turn';
                    text.style.color = '#3b82f6';
                } else {
                    $('gs-o').classList.add('active'); $('gs-x').classList.remove('active');
                    dot.className = 'dot dot-o';
                    text.textContent = currentLang === 'fr' ? 'Tour de O' : 'O Turn';
                    text.style.color = '#ef4444';
                }
            }

            function updatePlayerInfo() {
                updateSeriesUI();
                const info = $('player-info');
                if (gameMode === 'pvp') {
                    info.innerHTML = '';
                    return;
                }
                const cls = playerSymbol === 'X' ? 'you-x' : 'you-o';
                const aiCls = aiSymbol === 'X' ? 'you-x' : 'you-o';
                if (currentLang === 'fr') {
                    info.innerHTML = 'Toi : <span class="' + cls + '">' + playerSymbol + '</span> | IA : <span class="' +
                        aiCls + '">' + aiSymbol + '</span>';
                } else {
                    info.innerHTML = 'You: <span class="' + cls + '">' + playerSymbol + '</span> | AI: <span class="' +
                        aiCls + '">' + aiSymbol + '</span>';
                }
            }

            function checkWinner() {
                for (const combo of winCombos) {
                    const [a, b, c] = combo;
                    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                        return { winner: board[a], combo: combo };
                    }
                }
                if (board.every(c => c)) return { winner: 'draw', combo: null };
                return null;
            }

            function highlightWin(combo) {
                combo.forEach(i => cells[i].classList.add('win'));
                boardEl.classList.add('won');
                const first = cells[combo[0]], last = cells[combo[2]];
                const c = el => ({ x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 });
                const p = c(first), q = c(last);
                const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1;
                const ext = first.offsetWidth * 0.3;
                const x1 = p.x - dx / d * ext, y1 = p.y - dy / d * ext;
                const x2 = q.x + dx / d * ext, y2 = q.y + dy / d * ext;
                const len = Math.hypot(x2 - x1, y2 - y1);
                const NS = 'http://www.w3.org/2000/svg';
                const svg = document.createElementNS(NS, 'svg');
                svg.setAttribute('class', 'win-line');
                svg.setAttribute('viewBox', '0 0 ' + boardEl.offsetWidth + ' ' + boardEl.offsetHeight);
                const ln = document.createElementNS(NS, 'line');
                ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
                ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
                ln.style.setProperty('--len', len);
                svg.appendChild(ln);
                boardEl.appendChild(svg);
            }

            function endGame(result) {
                gameActive = false;
                $('gs-x').classList.remove('active');
                $('gs-o').classList.remove('active');
                boardEl.dataset.turn = '';
                if (result.winner === 'draw') {
                    statsDraw++;
                    const msg = currentLang === 'fr' ? 'Match nul !' : 'Draw!';
                    $('game-status').textContent = msg;
                    $('game-status').style.color = '#aab';
                    playSound('draw');
                    showModal(
                        currentLang === 'fr' ? 'Match nul !' : 'Draw!',
                        currentLang === 'fr' ? 'Pas de vainqueur cette fois.' : 'No winner this time.',
                        '🤝'
                    );
                } else {
                    const name = result.winner;
                    if (name === 'X') statsX++;
                    else statsO++;
                    highlightWin(result.combo);
                    const color = name === 'X' ? '#3b82f6' : '#ef4444';
                    const msg = (currentLang === 'fr' ? name + ' gagne !' : name + ' Wins!');
                    $('game-status').textContent = msg;
                    $('game-status').style.color = color;
                    playSound(gameMode !== 'pvp' && name === aiSymbol ? 'lose' : 'win');
                    const fr = currentLang === 'fr';
                    let emoji = name === 'X' ? '🔵' : '🔴';
                    let title = fr ? name + ' gagne !' : name + ' Wins!';
                    let text = fr ? 'Félicitations !' : 'Congratulations!';
                    let primary = null;
                    let big = false;
                    if (seriesFormat > 1) {
                        if (name === 'X') seriesX++;
                        else seriesO++;
                        const need = (seriesFormat + 1) / 2;
                        const score = 'X ' + seriesX + ' – ' + seriesO + ' O';
                        if (seriesX >= need || seriesO >= need) {
                            seriesOver = true;
                            big = true;
                            emoji = '🏆';
                            title = fr ? name + ' remporte le match !' : name + ' wins the match!';
                            text = (fr ? 'Score final : ' : 'Final score: ') + score;
                            primary = ['Nouveau match', 'New match'];
                        } else {
                            text = (fr ? 'Score du match : ' : 'Match score: ') + score;
                            primary = ['Manche suivante', 'Next round'];
                        }
                        updateSeriesUI();
                    }
                    showModal(title, text, emoji, primary);
                    if (gameMode === 'pvp' || name === playerSymbol) celebrate(name, big);
                }
                updateStatsUI();
                saveData();
            }

            function makeMove(index) {
                if (!gameActive || board[index] || aiThinking) return;
                if (gameMode !== 'pvp' && currentPlayer !== playerSymbol) return;
                playSound(currentPlayer === 'X' ? 'moveX' : 'moveO');
                board[index] = currentPlayer;
                history.push({ i: index, p: currentPlayer });
                renderBoard();
                const result = checkWinner();
                if (result) {
                    endGame(result);
                    return;
                }
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateTurn();
                if (gameMode !== 'pvp' && currentPlayer === aiSymbol && gameActive) {
                    aiThinking = true;
                    setTimeout(() => { aiMove(); }, 50 + Math.random() * 50);
                }
            }

            // ---- Confetti ----
            function celebrate(winner, big) {
                if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                let cv = $('confetti');
                if (!cv) {
                    cv = document.createElement('canvas');
                    cv.id = 'confetti';
                    document.body.appendChild(cv);
                }
                const dpr = window.devicePixelRatio || 1;
                const W = window.innerWidth, H = window.innerHeight;
                cv.width = W * dpr; cv.height = H * dpr;
                cv.style.width = W + 'px'; cv.style.height = H + 'px';
                const g = cv.getContext('2d');
                g.setTransform(dpr, 0, 0, dpr, 0, 0);
                const base = winner === 'X' ? ['#3b82f6', '#60a5fa', '#93c5fd'] : ['#ef4444', '#f87171', '#fca5a5'];
                const colors = base.concat(['#fbbf24', '#ffffff', '#22c55e']);
                const n = big ? 220 : 110;
                const parts = Array.from({ length: n }, () => ({
                    x: W / 2 + (Math.random() - 0.5) * 80,
                    y: H * 0.42,
                    vx: (Math.random() - 0.5) * (big ? 16 : 11),
                    vy: -(Math.random() * (big ? 17 : 12) + 4),
                    w: 6 + Math.random() * 6,
                    h: 4 + Math.random() * 5,
                    r: Math.random() * 6.28,
                    vr: (Math.random() - 0.5) * 0.4,
                    c: colors[(Math.random() * colors.length) | 0]
                }));
                const t0 = performance.now();
                const dur = big ? 3800 : 2600;
                cancelAnimationFrame(confettiRaf);
                (function frame(t) {
                    const el = t - t0;
                    g.clearRect(0, 0, W, H);
                    const fade = Math.max(0, Math.min(1, (dur - el) / 700));
                    parts.forEach(q => {
                        q.vy += 0.38; q.vx *= 0.995;
                        q.x += q.vx; q.y += q.vy; q.r += q.vr;
                        g.save();
                        g.globalAlpha = fade;
                        g.translate(q.x, q.y);
                        g.rotate(q.r);
                        g.fillStyle = q.c;
                        g.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
                        g.restore();
                    });
                    if (el < dur) confettiRaf = requestAnimationFrame(frame);
                    else g.clearRect(0, 0, W, H);
                })(t0);
            }

            // ---- AI ----
            function aiMove() {
                if (!gameActive) { aiThinking = false; return; }
                let move = Math.random() < MISTAKE_RATE[difficulty] ? getRandomMove() : getBestMove();
                if (move === -1) move = getRandomMove();
                if (move === -1) { aiThinking = false; return; }
                board[move] = aiSymbol;
                history.push({ i: move, p: aiSymbol });
                renderBoard();
                playSound(aiSymbol === 'X' ? 'moveX' : 'moveO');
                aiThinking = false;
                const result = checkWinner();
                if (result) {
                    endGame(result);
                    return;
                }
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateTurn();
            }

            function getRandomMove() {
                const empty = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
                return empty.length ? empty[Math.floor(Math.random() * empty.length)] : -1;
            }

            function getBestMove() {
                let bestScore = -Infinity,
                    move = -1;
                for (let i = 0; i < 9; i++) {
                    if (board[i] === '') {
                        board[i] = aiSymbol;
                        const score = minimax(board, 0, false, aiSymbol, playerSymbol);
                        board[i] = '';
                        if (score > bestScore) { bestScore = score;
                            move = i; }
                    }
                }
                return move;
            }

            function minimax(board, depth, isMaximizing, maxSym, minSym) {
                const result = checkWinner();
                if (result) {
                    if (result.winner === maxSym) return 10 - depth;
                    if (result.winner === minSym) return depth - 10;
                    return 0;
                }
                if (isMaximizing) {
                    let best = -Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (board[i] === '') {
                            board[i] = maxSym;
                            best = Math.max(best, minimax(board, depth + 1, false, maxSym, minSym));
                            board[i] = '';
                        }
                    }
                    return best;
                } else {
                    let best = Infinity;
                    for (let i = 0; i < 9; i++) {
                        if (board[i] === '') {
                            board[i] = minSym;
                            best = Math.min(best, minimax(board, depth + 1, true, maxSym, minSym));
                            board[i] = '';
                        }
                    }
                    return best;
                }
            }

            // ---- Modal ----
            function showModal(title, text, emoji, primary) {
                const pb = $('modal-primary');
                const lab = primary || ['Rejouer', 'Play Again'];
                pb.setAttribute('data-fr', lab[0]);
                pb.setAttribute('data-en', lab[1]);
                pb.textContent = currentLang === 'fr' ? lab[0] : lab[1];
                $('modal-title').textContent = title;
                $('modal-text').textContent = text;
                $('modal-emoji').textContent = emoji;
                $('modal').classList.add('visible');
                $('modal').style.display = 'flex';
            }

            function closeModal() {
                $('modal').classList.remove('visible');
                $('modal').style.display = 'none';
            }

            // ---- Expose globals ----
            window.goToMenu = goToMenu;
            window.goToStart = goToStart;
            window.startGame = startGame;
            window.showMenu = showMenu;
            window.resetGame = resetGame;
            window.makeMove = makeMove;
            window.closeModal = closeModal;
            window.toggleLanguage = toggleLanguage;
            window.setDifficulty = setDifficulty;
            window.resetStats = resetStats;
            window.setFormat = setFormat;

            // Click sound for buttons that don't already play one
            document.addEventListener('click', e => {
                if (e.target.closest && e.target.closest('.reset-btn, #modal-primary, .support-btn, .support-close, #support-copy, .support-link')) playSound('click');
            });

            // ---- Init ----
            try {
                const l = localStorage.getItem('xo_lang');
                if (l === 'fr' || l === 'en') currentLang = l;
            } catch (_) {}
            loadData();
            applyFormat();
            applyDifficulty();
            updateStatsUI();

            // show start screen by default
            $('start-screen').classList.remove('hidden');
            $('menu').classList.remove('visible');
            $('menu').style.display = 'none';
            $('game').classList.remove('visible');
            $('game').style.display = 'none';
            $('modal').classList.remove('visible');
            $('modal').style.display = 'none';

        })();
    </script>

    <script>
        // Self-playing demo on the home screen
        (function() {
            const NS = 'http://www.w3.org/2000/svg';
            const marksEl = document.getElementById('demo-marks');
            const boardEl = document.getElementById('demo-board');
            if (!marksEl) return;
            const C = i => ({ x: (i % 3) * 100 + 50, y: Math.floor(i / 3) * 100 + 50 });
            const games = [
                { moves: [0, 1, 4, 2, 8], win: [0, 4, 8] },
                { moves: [0, 4, 1, 2, 8, 6], win: [2, 4, 6] },
                { moves: [3, 0, 4, 1, 5], win: [3, 4, 5] }
            ];
            let g = 0;
            const timers = [];
            const later = (fn, ms) => timers.push(setTimeout(fn, ms));

            function el(name, attrs) {
                const n = document.createElementNS(NS, name);
                for (const k in attrs) n.setAttribute(k, attrs[k]);
                return n;
            }
            function addMark(i, isX) {
                const { x, y } = C(i), r = 26;
                if (isX) {
                    [[-r, -r, r, r], [r, -r, -r, r]].forEach((d, k) => {
                        const l = el('line', { x1: x + d[0], y1: y + d[1], x2: x + d[2], y2: y + d[3], class: 'demo-mark mx' });
                        const len = Math.hypot(d[2] - d[0], d[3] - d[1]);
                        l.style.setProperty('--len', len);
                        l.style.animationDelay = (k * 0.12) + 's';
                        marksEl.appendChild(l);
                    });
                } else {
                    const c = el('circle', { cx: x, cy: y, r: r, class: 'demo-mark mo' });
                    const len = 2 * Math.PI * r;
                    c.style.setProperty('--len', len);
                    marksEl.appendChild(c);
                }
            }
            function addWin(combo) {
                const a = C(combo[0]), b = C(combo[2]);
                const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) + 56;
                const ux = dx / (len - 56), uy = dy / (len - 56);
                const l = el('line', {
                    x1: a.x - ux * 28, y1: a.y - uy * 28, x2: b.x + ux * 28, y2: b.y + uy * 28,
                    class: 'demo-win'
                });
                l.style.setProperty('--len', len);
                marksEl.appendChild(l);
            }
            function play() {
                const game = games[g % games.length];
                g++;
                marksEl.innerHTML = '';
                boardEl.classList.remove('fade-out');
                let t = 500;
                game.moves.forEach((cell, n) => {
                    later(() => addMark(cell, n % 2 === 0), t);
                    t += 720;
                });
                later(() => addWin(game.win), t);
                t += 1900;
                later(() => boardEl.classList.add('fade-out'), t);
                later(play, t + 450);
            }
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                const game = games[0];
                game.moves.forEach((cell, n) => addMark(cell, n % 2 === 0));
                addWin(game.win);
                marksEl.querySelectorAll('.demo-mark, .demo-win').forEach(n => n.style.strokeDashoffset = 0);
            } else {
                play();
            }
        })();
    </script>

    <script>
        // Soft ambient background music (generated live, no audio files)
        (function() {
            const btn = document.getElementById('music-btn');
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!btn || !AC) { if (btn) btn.style.display = 'none'; return; }

            let ctx = null, master = null, bus = null, delay = null;
            let timer = null, nextTime = 0, step = 0, started = false, on = true;
            try { if (localStorage.getItem('xo_music') === 'off') on = false; } catch (_) {}

            const BPM = 72, EIGHTH = 60 / BPM / 2;
            const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
            // Am - F - C - G : bass note, pad voicing
            const CHORDS = [
                { bass: 45, pad: [57, 60, 64] },
                { bass: 41, pad: [53, 57, 60] },
                { bass: 48, pad: [55, 60, 64] },
                { bass: 43, pad: [55, 59, 62] }
            ];
            const ARP = [0, 1, 2, 1, 2, 1, 0, 1];

            function init() {
                ctx = new AC();
                master = ctx.createGain();
                master.gain.value = 0;
                master.connect(ctx.destination);
                bus = ctx.createBiquadFilter();
                bus.type = 'lowpass';
                bus.frequency.value = 2000;
                bus.connect(master);
                delay = ctx.createDelay(1.5);
                delay.delayTime.value = 60 / BPM * 0.75;
                const fb = ctx.createGain(); fb.gain.value = 0.38;
                const wet = ctx.createGain(); wet.gain.value = 0.45;
                delay.connect(fb); fb.connect(delay);
                delay.connect(wet); wet.connect(bus);
            }

            function tone(freq, t, dur, type, peak, attack, release, detune, toDelay) {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = type;
                o.frequency.value = freq;
                o.detune.value = detune || 0;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(peak, t + attack);
                g.gain.setValueAtTime(peak, t + Math.max(attack, dur - release));
                g.gain.linearRampToValueAtTime(0.0001, t + dur);
                o.connect(g);
                g.connect(bus);
                if (toDelay) g.connect(delay);
                o.start(t);
                o.stop(t + dur + 0.05);
            }

            function pluck(freq, t) {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'sine';
                o.frequency.value = freq;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(0.06, t + 0.015);
                g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
                o.connect(g);
                g.connect(bus);
                g.connect(delay);
                o.start(t);
                o.stop(t + 1.6);
            }

            function schedule() {
                if (!ctx) return;
                while (nextTime < ctx.currentTime + 0.8) {
                    const chord = CHORDS[Math.floor(step / 16) % CHORDS.length];
                    const pos = step % 16;
                    if (pos === 0) {
                        const dur = 16 * EIGHTH + 1.2;
                        chord.pad.forEach(m => {
                            tone(mtof(m), nextTime, dur, 'triangle', 0.028, 1.8, 1.8, -6);
                            tone(mtof(m), nextTime, dur, 'sine', 0.03, 1.8, 1.8, 6);
                        });
                        tone(mtof(chord.bass), nextTime, dur, 'sine', 0.07, 1.2, 1.6, 0);
                    }
                    if (pos % 4 === 0 || Math.random() > 0.35) {
                        const note = chord.pad[ARP[pos % 8]] + 12;
                        pluck(mtof(note), nextTime);
                    }
                    nextTime += EIGHTH;
                    step++;
                }
            }

            function start() {
                if (!ctx) init();
                started = true;
                const go = () => {
                    nextTime = ctx.currentTime + 0.1;
                    if (!timer) timer = setInterval(schedule, 120);
                    schedule();
                    master.gain.cancelScheduledValues(ctx.currentTime);
                    master.gain.setTargetAtTime(0.55, ctx.currentTime, 0.9);
                };
                if (ctx.state === 'suspended') ctx.resume().then(go).catch(() => {}); else go();
            }

            function stop() {
                if (!ctx) return;
                master.gain.cancelScheduledValues(ctx.currentTime);
                master.gain.setTargetAtTime(0, ctx.currentTime, 0.2);
                setTimeout(() => {
                    if (!on && timer) { clearInterval(timer); timer = null; }
                }, 1200);
            }

            function paint() {
                btn.classList.toggle('on', on);
                btn.setAttribute('aria-pressed', String(on));
            }

            btn.addEventListener('click', () => {
                on = !on;
                try { localStorage.setItem('xo_music', on ? 'on' : 'off'); } catch (_) {}
                paint();
                if (on) start(); else stop();
            });

            // Browsers only allow sound after a tap, so music begins on the first tap
            const firstTap = e => {
                if (e.target.closest && e.target.closest('#music-btn')) return;
                document.removeEventListener('pointerdown', firstTap, true);
                if (on && !started) start();
            };
            document.addEventListener('pointerdown', firstTap, true);

            document.addEventListener('visibilitychange', () => {
                if (!ctx) return;
                if (document.hidden) ctx.suspend().catch(() => {});
                else if (on && started) ctx.resume().catch(() => {});
            });

            paint();
        })();
    </script>

    <script>
        // Support popup
        (function() {
            const modal = document.getElementById('support-modal');
            const EMAIL = 'fifap9018@gmail.com';
            let copyTimer = null;
            const fr = () => document.documentElement.lang !== 'en';

            window.openSupport = function() { modal.classList.add('visible'); };
            window.closeSupport = function() { modal.classList.remove('visible'); };

            window.copySupportMail = function() {
                const btn = document.getElementById('support-copy');
                const done = () => {
                    btn.textContent = fr() ? 'Copié !' : 'Copied!';
                    clearTimeout(copyTimer);
                    copyTimer = setTimeout(() => {
                        btn.textContent = btn.getAttribute(fr() ? 'data-fr' : 'data-en');
                    }, 1600);
                };
                const fallback = () => {
                    const t = document.createElement('textarea');
                    t.value = EMAIL;
                    t.style.position = 'fixed';
                    t.style.opacity = '0';
                    document.body.appendChild(t);
                    t.select();
                    try { document.execCommand('copy'); } catch (_) {}
                    document.body.removeChild(t);
                    done();
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(EMAIL).then(done).catch(fallback);
                } else {
                    fallback();
                }
            };

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') window.closeSupport();
            });
        })();
    </script>
