<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>X _ O</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: #fff;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ----- Start Screen ----- */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
            height: 100%;
            padding: 24px 20px;
            position: relative;
            z-index: 2;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .start-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .start-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
            background-size: 56px 56px;
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 20%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 20%, transparent 75%);
        }
        .orb {
            position: absolute;
            width: 52vmax;
            height: 52vmax;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.32;
        }
        .orb-x {
            background: #3b82f6;
            top: -22vmax;
            left: -18vmax;
            animation: drift1 16s ease-in-out infinite alternate;
        }
        .orb-o {
            background: #ef4444;
            bottom: -24vmax;
            right: -18vmax;
            animation: drift2 18s ease-in-out infinite alternate;
        }
        @keyframes drift1 {
            to { transform: translate(8vmax, 6vmax); }
        }
        @keyframes drift2 {
            to { transform: translate(-8vmax, -6vmax); }
        }

        .start-lang {
            position: absolute;
            top: 16px;
            inset-inline-end: 16px;
            z-index: 5;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.15s, border-color 0.15s;
        }
        .start-lang:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .start-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto;
        }
        .start-title {
            font-size: clamp(56px, 11vh, 96px);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: 8px;
            direction: ltr;
            animation: titleIn 0.9s cubic-bezier(.2, .8, .2, 1) both, startGlow 3.2s ease-in-out 0.9s infinite alternate;
        }
        @keyframes titleIn {
            from { opacity: 0; transform: translateY(14px) scale(0.94); filter: blur(6px); }
            to { opacity: 1; transform: none; filter: none; }
        }
        @keyframes startGlow {
            from {
                text-shadow: 0 0 24px rgba(59, 130, 246, 0.45), 0 0 48px rgba(239, 68, 68, 0.2);
            }
            to {
                text-shadow: 0 0 36px rgba(59, 130, 246, 0.75), 0 0 80px rgba(239, 68, 68, 0.45);
            }
        }
        .start-title .x { color: #3b82f6; }
        .start-title .o { color: #ef4444; }
        .start-title .dash { color: #5b5b66; margin: 0 6px; }
        .start-subtitle {
            font-size: 17px;
            color: #9a9aa6;
            margin-bottom: clamp(18px, 4vh, 36px);
            letter-spacing: 3px;
            animation: fadeUp 0.7s ease 0.25s both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        /* Live demo board */
        .demo-wrap {
            width: clamp(150px, 30vh, 250px);
            aspect-ratio: 1;
            margin-bottom: clamp(20px, 4.5vh, 38px);
            padding: 10px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), inset 0 0 40px rgba(59, 130, 246, 0.05);
            animation: fadeUp 0.7s ease 0.4s both;
        }
        .demo-board { width: 100%; height: 100%; display: block; direction: ltr; overflow: visible; }
        .demo-grid line {
            stroke: rgba(255, 255, 255, 0.16);
            stroke-width: 3;
            stroke-linecap: round;
        }
        .demo-mark {
            fill: none;
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: var(--len);
            stroke-dashoffset: var(--len);
            animation: drawMark 0.32s ease-out forwards;
        }
        .demo-mark.mx { stroke: #3b82f6; filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.8)); }
        .demo-mark.mo { stroke: #ef4444; filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.8)); }
        @keyframes drawMark { to { stroke-dashoffset: 0; } }
        .demo-win {
            stroke: #22c55e;
            stroke-width: 7;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.9));
            stroke-dasharray: var(--len);
            stroke-dashoffset: var(--len);
            animation: drawMark 0.4s ease-out forwards;
        }
        .demo-board.fade-out { opacity: 0; transition: opacity 0.4s ease; }

        .start-btn {
            padding: 18px 76px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6 50%, #ef4444);
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            letter-spacing: 4px;
            position: relative;
            overflow: hidden;
            z-index: 3;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35), 0 8px 32px rgba(239, 68, 68, 0.2);
            animation: fadeUp 0.7s ease 0.55s both;
        }
        .start-btn::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            left: -60%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-20deg);
            animation: shine 3.6s ease-in-out 1.6s infinite;
        }
        @keyframes shine {
            0% { left: -60%; }
            35%, 100% { left: 130%; }
        }
        .start-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 12px 44px rgba(59, 130, 246, 0.55), 0 12px 44px rgba(239, 68, 68, 0.35);
        }
        .start-btn:active { transform: scale(0.97); }
        .start-btn:focus-visible,
        .start-lang:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        .start-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: clamp(16px, 3.5vh, 28px);
            animation: fadeUp 0.7s ease 0.7s both;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.045);
            color: #b4b4bf;
            font-size: 13px;
            font-weight: 600;
        }
        .chip i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .chip .c-blue { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }
        .chip .c-red { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

        @media (prefers-reduced-motion: reduce) {
            .orb, .start-title, .start-btn::after { animation: none !important; }
            .start-subtitle, .demo-wrap, .start-btn, .start-chips { animation: none !important; }
        }

        /* ----- Menu ----- */
        #menu {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 72px 20px 28px;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            z-index: 2;
        }
        #menu.visible { display: flex; }
        .menu-content {
            position: relative;
            z-index: 2;
            margin: auto;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .lang-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.15s, border-color 0.15s;
        }
        .lang-toggle:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); }

        .menu-title {
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 6px;
            direction: ltr;
            margin-bottom: 8px;
            text-shadow: 0 0 36px rgba(59, 130, 246, 0.55), 0 0 70px rgba(239, 68, 68, 0.25);
            animation: fadeUp 0.5s ease both;
        }
        .menu-title .x { color: #3b82f6; }
        .menu-title .o { color: #ef4444; }
        .menu-title .dash { color: #5b5b66; margin: 0 4px; }
        .menu-tagline {
            font-size: 15px;
            color: #9a9aa6;
            margin-bottom: 26px;
            animation: fadeUp 0.5s ease 0.08s both;
        }

        /* Scoreboard */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            width: 100%;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(12px);
            overflow: hidden;
            margin-bottom: 22px;
            direction: ltr;
            animation: fadeUp 0.5s ease 0.16s both;
        }
        .score-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 14px 6px 12px;
            position: relative;
        }
        .score-cell + .score-cell::before {
            content: '';
            position: absolute;
            inset-block: 16px;
            inset-inline-start: 0;
            width: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
        .score-num { font-size: 34px; font-weight: 800; line-height: 1.1; }
        .score-label { font-size: 13px; font-weight: 600; color: #9a9aa6; }
        .x-color { color: #3b82f6; }
        .o-color { color: #ef4444; }
        .draw-color { color: #b4b4c2; }
        .score-cell.sx { background: linear-gradient(180deg, rgba(59,130,246,0.12), transparent 70%); }
        .score-cell.so { background: linear-gradient(180deg, rgba(239,68,68,0.12), transparent 70%); }

        /* Mode cards */
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }
        .mode-card {
            --c: 59, 130, 246;
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 20px 18px;
            border-radius: 22px;
            border: 1px solid rgba(var(--c), 0.28);
            background: linear-gradient(135deg, rgba(var(--c), 0.16), rgba(255, 255, 255, 0.035) 65%);
            color: #fff;
            font-family: inherit;
            text-align: start;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        .mode-card.red { --c: 239, 68, 68; }
        .mode-card:nth-child(1) { animation: fadeUp 0.5s ease 0.24s both; }
        .mode-card:nth-child(2) { animation: fadeUp 0.5s ease 0.32s both; }
        .mode-card:hover {
            transform: translateY(-3px);
            border-color: rgba(var(--c), 0.6);
            box-shadow: 0 10px 34px rgba(var(--c), 0.28);
        }
        .mode-card:active { transform: scale(0.98); }
        .mode-card:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        .mode-icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
            background: rgba(var(--c), 0.2);
            border: 1px solid rgba(var(--c), 0.35);
            box-shadow: 0 0 22px rgba(var(--c), 0.35);
        }
        .mode-text { flex: 1; min-width: 0; }
        .mode-name { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
        .mode-desc { font-size: 13px; line-height: 1.5; color: #b0b0bd; }
        .mode-arrow {
            font-size: 22px;
            color: rgba(var(--c), 1);
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }
        .mode-card:hover .mode-arrow { transform: translateX(4px); }
        .badge {
            display: inline-block;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 700;
            margin-inline-start: 8px;
            vertical-align: middle;
        }
        .badge-hard { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }
        .badge-2p { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.35); }

        .level-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            animation: fadeUp 0.5s ease 0.4s both;
        }
        .level-label { font-size: 13px; font-weight: 600; color: #9a9aa6; padding: 0 8px; white-space: nowrap; }
        .level-btn {
            flex: 1;
            padding: 10px 6px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: transparent;
            color: #b4b4c2;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .level-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .level-btn.active[data-level="easy"] { background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: rgba(34, 197, 94, 0.4); }
        .level-btn.active[data-level="medium"] { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }
        .level-btn.active[data-level="hard"] { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
        .level-btn:focus-visible, .reset-stats:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
        .badge-easy { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.35); }
        .badge-medium { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
        .reset-stats {
            margin-top: 18px;
            background: none;
            border: none;
            color: #77778a;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .reset-stats:hover { color: #b4b4c2; }

        @media (max-width: 380px) {
            .menu-title { font-size: 52px; }
            .mode-card { padding: 16px 14px; gap: 12px; }
            .mode-icon { width: 50px; height: 50px; font-size: 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .menu-title, .menu-tagline, .scoreboard, .mode-card { animation: none !important; }
        }

        /* ----- Game ----- */
        #game {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px 16px;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            z-index: 2;
        }
        #game.visible { display: flex; }
        .game-content {
            position: relative;
            z-index: 2;
            margin: auto;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* header */
        .game-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            width: 100%;
            margin-bottom: 18px;
            gap: 8px;
            direction: ltr;
        }
        .game-header .back-btn { justify-self: start; }
        .game-header .reset-btn { justify-self: end; }
        .back-btn, .reset-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            white-space: nowrap;
            transition: background 0.15s, transform 0.15s;
        }
        .back-btn:hover, .reset-btn:hover { background: rgba(255, 255, 255, 0.13); }
        .back-btn:active, .reset-btn:active { transform: scale(0.95); }
        .back-btn:focus-visible, .reset-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
        .back-btn svg, .reset-btn svg { flex-shrink: 0; }

        .turn-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            font-size: 15px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .dot-x { background: #3b82f6; box-shadow: 0 0 12px #3b82f6; }
        .dot-o { background: #ef4444; box-shadow: 0 0 12px #ef4444; }

        /* scoreboard (also shows whose turn it is) */
        .game-stats {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: stretch;
            gap: 10px;
            width: 100%;
            margin-bottom: 8px;
            direction: ltr;
        }
        .game-stat {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .game-stat.sx.active {
            border-color: rgba(59, 130, 246, 0.7);
            background: rgba(59, 130, 246, 0.14);
            box-shadow: 0 0 24px rgba(59, 130, 246, 0.28);
        }
        .game-stat.so.active {
            border-color: rgba(239, 68, 68, 0.7);
            background: rgba(239, 68, 68, 0.14);
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.28);
        }
        .game-stat.sd { padding: 10px 16px; flex-direction: column; gap: 0; }
        .game-stat-num { font-size: 26px; font-weight: 800; line-height: 1.1; min-width: 20px; text-align: center; }
        .game-stat-num.x-color { color: #3b82f6; }
        .game-stat-num.o-color { color: #ef4444; }
        .game-stat-num.draw-color { color: #b4b4c2; font-size: 20px; }
        .game-stat-label { font-size: 15px; font-weight: 800; color: #9a9aa6; }
        .game-stat.sx .game-stat-label { color: #60a5fa; font-size: 20px; }
        .game-stat.so .game-stat-label { color: #f87171; font-size: 20px; }
        .game-stat.sd .game-stat-label { font-size: 12px; }

        .player-info {
            text-align: center;
            font-size: 13px;
            color: #8a8a98;
            margin: 6px 0 14px;
            font-weight: 600;
            min-height: 18px;
        }
        .player-info span { font-weight: 800; }
        .player-info .you-x { color: #3b82f6; }
        .player-info .you-o { color: #ef4444; }

        /* board */
        .board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 0 50px rgba(59, 130, 246, 0.05);
            backdrop-filter: blur(14px);
            direction: ltr;
        }
        .cell {
            position: relative;
            aspect-ratio: 1;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(10, 10, 14, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s;
        }
        .cell:hover:not(.taken) { background: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.18); }
        .cell:active:not(.taken) { transform: scale(0.95); }
        .cell.taken { cursor: default; }
        /* ghost preview of the next mark */
        .board[data-turn="X"] .cell:not(.taken):hover::after,
        .board[data-turn="O"] .cell:not(.taken):hover::after {
            position: absolute;
            font-size: 44px;
            font-weight: 800;
            opacity: 0.28;
        }
        .board[data-turn="X"] .cell:not(.taken):hover::after { content: 'X'; color: #3b82f6; }
        .board[data-turn="O"] .cell:not(.taken):hover::after { content: 'O'; color: #ef4444; }

        .cell svg { width: 58%; height: 58%; overflow: visible; display: block; }
        .cell svg .m {
            fill: none;
            stroke-width: 11;
            stroke-linecap: round;
        }
        .cell.new svg .m {
            stroke-dasharray: var(--len);
            stroke-dashoffset: var(--len);
            animation: drawMark 0.28s ease-out forwards;
        }
        .cell.new svg .m + .m { animation-delay: 0.1s; }
        .cell .mark-x .m { stroke: #3b82f6; }
        .cell .mark-o .m { stroke: #ef4444; }
        .cell .mark-x { filter: drop-shadow(0 0 7px rgba(59, 130, 246, 0.85)); }
        .cell .mark-o { filter: drop-shadow(0 0 7px rgba(239, 68, 68, 0.85)); }

        .cell.win {
            background: rgba(34, 197, 94, 0.16);
            border-color: rgba(34, 197, 94, 0.55);
            box-shadow: 0 0 26px rgba(34, 197, 94, 0.3);
        }
        .board.won .cell:not(.win) svg { opacity: 0.3; transition: opacity 0.3s; }

        .win-line {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }
        .win-line line {
            stroke: #fff;
            stroke-width: 6;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(34, 197, 94, 1));
            stroke-dasharray: var(--len);
            stroke-dashoffset: var(--len);
            animation: drawMark 0.4s ease-out 0.1s forwards;
        }

        @keyframes drawMark { to { stroke-dashoffset: 0; } }

        .status {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            margin: 18px 0 0;
            min-height: 32px;
            color: #fff;
        }

        @media (prefers-reduced-motion: reduce) {
            .cell.new svg .m, .win-line line { animation: none !important; stroke-dashoffset: 0 !important; }
        }

        .home-back {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;

        }
        .home-back:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); }
        .home-back:active { transform: scale(0.95); }
        .home-back:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

        .start-lang b, .lang-toggle b { color: #77778a; font-weight: 700; transition: color 0.15s; }
        .start-lang i, .lang-toggle i { color: #5b5b66; font-style: normal; margin: 0 5px; }
        .start-lang b.active, .lang-toggle b.active { color: #fff; }

        /* ----- Format row (series) ----- */
        .format-row { margin-top: -2px; animation-delay: 0.48s; }
        .fmt-btn { font-size: 13px; padding: 10px 4px; }
        .level-btn.fmt-btn.active { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border-color: rgba(59, 130, 246, 0.4); }

        .series-info {
            display: none;
            margin: -6px 0 12px;
            padding: 5px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            font-size: 13px;
            font-weight: 700;
            color: #b4b4c2;
        }
        .series-info .sc-x { color: #60a5fa; }
        .series-info .sc-o { color: #f87171; }

        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 150; }

        /* ----- Support ----- */
        .support-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: clamp(16px, 3.5vh, 28px);
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            color: #e4e4ec;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
            animation: fadeUp 0.7s ease 0.85s both;
        }
        .support-btn:hover { background: rgba(255, 255, 255, 0.13); border-color: rgba(255, 255, 255, 0.28); }
        .support-btn:active { transform: scale(0.96); }
        .support-btn:focus-visible, .support-link:focus-visible, .support-close:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        .support-mail {
            margin: -8px 0 22px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            word-break: break-all;
            user-select: all;
        }
        .support-link {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .support-close {
            margin-top: 14px;
            background: none;
            border: none;
            color: #8a8a98;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .support-close:hover { color: #fff; }
        @media (prefers-reduced-motion: reduce) { .support-btn { animation: none !important; } }

        /* ----- Music toggle ----- */
        .music-btn {
            position: fixed;
            left: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            z-index: 60;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.15s, transform 0.15s, color 0.15s;
        }
        .music-btn:hover { background: rgba(255, 255, 255, 0.14); }
        .music-btn:active { transform: scale(0.92); }
        .music-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        .music-btn svg { width: 22px; height: 22px; }
        .music-btn .waves, .music-btn .slash { display: none; }
        .music-btn.on .waves { display: inline; }
        .music-btn.on { color: #60a5fa; border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 18px rgba(59, 130, 246, 0.3); }
        .music-btn:not(.on) .slash { display: inline; }
        .music-btn:not(.on) { color: #8a8a98; }

        /* ----- Modal ----- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.05s ease;
        }
        .overlay.visible {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: rgba(17, 17, 17, 0.95);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            animation: slideUp 0.1s ease;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .modal-emoji {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .modal-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        .modal-text {
            font-size: 15px;
            color: #888;
            margin-bottom: 24px;
        }
        .modal-btns {
            display: flex;
            gap: 12px;
        }
        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.05s;
        }
        .modal-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .modal-btn.primary {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }
        .modal-btn.primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .hidden {
            display: none !important;
        }

        /* ----- Responsive ----- */
        @media (max-width: 480px) {
            .start-title {
                font-size: 52px;
                letter-spacing: 4px;
            }
            .start-btn {
                padding: 16px 44px;
                font-size: 22px;
            }
        }

        /* ===== Menu design polish ===== */
        .menu-title {
            font-size: 62px;
            letter-spacing: 9px;
            animation: fadeUp 0.5s ease both, titleFloat 5s ease-in-out 0.6s infinite;
        }
        @keyframes titleFloat { 50% { transform: translateY(-5px); } }
        .menu-tagline {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }
        #menu { padding: 64px 18px 96px; }
        .scoreboard { margin-bottom: 16px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025));
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .score-cell { padding: 12px 6px; }
        .score-num { font-size: 32px; font-variant-numeric: tabular-nums; }
        .score-label { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; }
        .menu-buttons { gap: 20px; }
        .mode-name { font-size: 17px; }
        .mode-desc { font-size: 12.5px; line-height: 1.45; }
        .mode-card {
            padding: 14px 14px;
            gap: 12px;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }
        .mode-icon {
            width: 52px;
            height: 52px;
            font-size: 25px;
            border-radius: 16px;
            background: linear-gradient(145deg, rgba(var(--c), 0.38), rgba(var(--c), 0.1));
        }
        .mode-arrow {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(var(--c), 0.16);
            font-size: 16px;
        }
        .mode-card:hover .mode-arrow { transform: translateX(3px); }
        .level-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 10px 6px 6px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.025));
        }
        .level-label {
            grid-column: 1 / -1;
            padding: 0 8px 6px;
            font-size: 11px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: #8a8a9c;
        }
        .level-btn { padding: 10px 4px; border-radius: 13px; font-size: 13.5px; }
        .level-btn.active { font-weight: 800; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
        .reset-stats {
            margin-top: 16px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        @media (max-width: 380px) { .menu-title { font-size: 52px; letter-spacing: 6px; } .mode-icon { width: 46px; height: 46px; } }
        @media (prefers-reduced-motion: reduce) { .menu-title { animation: none !important; } }

        /* ===== Ultimate Edition banner ===== */
        .menu-edition {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 0 10px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 5px;
            white-space: nowrap;
            direction: ltr;
            animation: fadeUp 0.5s ease 0.05s both;
        }
        .menu-edition span {
            background: linear-gradient(90deg, #fde047, #fb923c, #f472b6, #a78bfa, #38bdf8, #fde047);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(251, 146, 60, 0.5));
            animation: editionShine 5s linear infinite;
        }
        .menu-edition::before, .menu-edition::after {
            content: '';

            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, #fb923c);
        }
        .menu-edition::after { background: linear-gradient(90deg, #a78bfa, transparent); }
        @keyframes editionShine { to { background-position: 200% 0; } }
        @media (prefers-reduced-motion: reduce) { .menu-edition span, .menu-edition { animation: none; } }
    </style>
</head>
<body>

    <div class="container" id="app">

        <!-- ===== START SCREEN ===== -->
        <div id="start-screen">
            <div class="start-bg"><div class="orb orb-x"></div><div class="orb orb-o"></div></div>
            <button class="start-lang" onclick="toggleLanguage()" aria-label="Langue / Language"><b data-l="fr">FR</b><i>/</i><b data-l="en">EN</b></button>

            <div class="start-content">
                <div class="start-title"><span class="x">X</span><span class="dash">_</span><span class="o">O</span></div>
                <div class="start-subtitle" data-fr="ÉDITION ULTIME" data-en="ULTIMATE EDITION">ÉDITION ULTIME</div>

                <div class="demo-wrap" aria-hidden="true">
                    <svg class="demo-board" id="demo-board" viewBox="0 0 300 300">
                        <g class="demo-grid">
                            <line x1="100" y1="12" x2="100" y2="288"/>
                            <line x1="200" y1="12" x2="200" y2="288"/>
                            <line x1="12" y1="100" x2="288" y2="100"/>
                            <line x1="12" y1="200" x2="288" y2="200"/>
                        </g>
                        <g id="demo-marks"></g>
                    </svg>
                </div>

                <button class="start-btn" onclick="goToMenu()" data-fr="JOUER" data-en="START">JOUER</button>
                <button class="support-btn" onclick="openSupport()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>
                    <span data-fr="Support" data-en="Support">Support</span>
                </button>
            </div>
        </div>

        <!-- ===== MENU ===== -->
        <div id="menu">
            <div class="start-bg"><div class="orb orb-x"></div><div class="orb orb-o"></div></div>
            <button class="home-back" onclick="goToStart()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
                <span data-fr="Accueil" data-en="Home">Accueil</span>
            </button>
            <button class="lang-toggle" onclick="toggleLanguage()" aria-label="Langue / Language"><b data-l="fr">FR</b><i>/</i><b data-l="en">EN</b></button>

            <div class="menu-content">
                <div class="menu-title"><span class="x">X</span><span class="dash">_</span><span class="o">O</span></div>
                <div class="menu-edition"><span>ULTIMATE EDITION</span></div>
                <div class="menu-tagline" data-fr="Choisis ton mode de jeu" data-en="Choose how to play">Choisis ton mode de jeu</div>

                <div class="scoreboard">
                    <div class="score-cell sx">
                        <div class="score-num x-color" id="menu-stat-x">0</div>
                        <div class="score-label" data-fr="Victoires X" data-en="X Wins">Victoires X</div>
                    </div>
                    <div class="score-cell">
                        <div class="score-num draw-color" id="menu-stat-draw">0</div>
                        <div class="score-label" data-fr="Nuls" data-en="Draws">Nuls</div>
                    </div>
                    <div class="score-cell so">
                        <div class="score-num o-color" id="menu-stat-o">0</div>
                        <div class="score-label" data-fr="Victoires O" data-en="O Wins">Victoires O</div>
                    </div>
                </div>

                <div class="menu-buttons">
                    <button class="mode-card" onclick="startGame('pvp')">
                        <div class="mode-icon">👥</div>
                        <div class="mode-text">
                            <div class="mode-name"><span data-fr="Joueur contre joueur" data-en="Player vs Player">Joueur contre joueur</span><span class="badge badge-2p">2P</span></div>
                            <div class="mode-desc" data-fr="Jouez à tour de rôle sur le même appareil" data-en="Take turns on the same device">Jouez à tour de rôle sur le même appareil</div>
                        </div>
                        <div class="mode-arrow">➜</div>
                    </button>
                    <button class="mode-card red" onclick="startGame('ai-hard')">
                        <div class="mode-icon">🤖</div>
                        <div class="mode-text">
                            <div class="mode-name"><span data-fr="Contre l'IA" data-en="vs AI">Contre l'IA</span><span class="badge badge-hard" id="ai-badge" data-fr="Difficile" data-en="Hard">Difficile</span></div>
                            <div class="mode-desc" id="ai-desc" data-fr="Un adversaire qui ne se trompe jamais. Peux-tu faire match nul ?" data-en="An opponent that never slips. Can you draw?">Un adversaire qui ne se trompe jamais. Peux-tu faire match nul ?</div>
                        </div>
                        <div class="mode-arrow">➜</div>
                    </button>
                    <div class="level-row">
                        <span class="level-label" data-fr="Niveau de l'IA" data-en="AI level">Niveau de l'IA</span>
                        <button class="level-btn" data-level="easy" onclick="setDifficulty('easy')" data-fr="Facile" data-en="Easy">Facile</button>
                        <button class="level-btn" data-level="medium" onclick="setDifficulty('medium')" data-fr="Moyen" data-en="Medium">Moyen</button>
                        <button class="level-btn" data-level="hard" onclick="setDifficulty('hard')" data-fr="Difficile" data-en="Hard">Difficile</button>
                    </div>
                    <div class="level-row format-row">
                        <span class="level-label" data-fr="Format" data-en="Format">Format</span>
                        <button class="level-btn fmt-btn" data-format="1" onclick="setFormat(1)" data-fr="1 manche" data-en="Single">1 manche</button>
                        <button class="level-btn fmt-btn" data-format="3" onclick="setFormat(3)" data-fr="Match en 3" data-en="Best of 3">Match en 3</button>
                        <button class="level-btn fmt-btn" data-format="5" onclick="setFormat(5)" data-fr="Match en 5" data-en="Best of 5">Match en 5</button>
                    </div>
                </div>
                <button class="reset-stats" onclick="resetStats()" data-fr="Réinitialiser les scores" data-en="Reset scores">Réinitialiser les scores</button>
            </div>
        </div>

        <!-- ===== GAME ===== -->
        <div id="game">
            <div class="start-bg"><div class="orb orb-x"></div><div class="orb orb-o"></div></div>
            <div class="game-content">
                <div class="game-header">
                    <button class="back-btn" onclick="showMenu()">
                        <svg class="ico-back" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
                        <span data-fr="Menu" data-en="Menu">Menu</span>
                    </button>
                    <div class="turn-indicator" id="turn-indicator">
                        <span class="dot dot-x" id="turn-dot"></span>
                        <span id="turn-text">Tour de X</span>
                    </div>
                    <button class="reset-btn" onclick="resetGame()">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
                        <span data-fr="Relancer" data-en="Reset">Relancer</span>
                    </button>
                </div>

                <div class="game-stats">
                    <div class="game-stat sx" id="gs-x">
                        <div class="game-stat-label" data-fr="X" data-en="X">X</div>
                        <div class="game-stat-num x-color" id="game-stat-x">0</div>
                    </div>
                    <div class="game-stat sd">
                        <div class="game-stat-num draw-color" id="game-stat-draw">0</div>
                        <div class="game-stat-label" data-fr="Nul" data-en="Draw">Nul</div>
                    </div>
                    <div class="game-stat so" id="gs-o">
                        <div class="game-stat-num o-color" id="game-stat-o">0</div>
                        <div class="game-stat-label" data-fr="O" data-en="O">O</div>
                    </div>
                </div>

                <div class="player-info" id="player-info"></div>
                <div class="series-info" id="series-info"></div>

                <div class="board" id="board">
                    <div class="cell" data-index="0" onclick="makeMove(0)"></div>
                    <div class="cell" data-index="1" onclick="makeMove(1)"></div>
                    <div class="cell" data-index="2" onclick="makeMove(2)"></div>
                    <div class="cell" data-index="3" onclick="makeMove(3)"></div>
                    <div class="cell" data-index="4" onclick="makeMove(4)"></div>
                    <div class="cell" data-index="5" onclick="makeMove(5)"></div>
                    <div class="cell" data-index="6" onclick="makeMove(6)"></div>
                    <div class="cell" data-index="7" onclick="makeMove(7)"></div>
                    <div class="cell" data-index="8" onclick="makeMove(8)"></div>
                </div>

                <div class="status" id="game-status"></div>
            </div>
        </div>

    </div>

    <button class="music-btn on" id="music-btn" aria-label="Musique" title="Musique / Music" aria-pressed="true">

            <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g>
            <line class="slash" x1="16" y1="9" x2="22" y2="15"/><line class="slash" x1="22" y1="9" x2="16" y2="15"/>
        </svg>

    <div id="support-modal" class="overlay" onclick="if(event.target===this)closeSupport()">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="support-title">

            <div class="modal-title" id="support-title" data-fr="Support" data-en="Support">Support</div>
